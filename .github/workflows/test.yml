name: test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: apply_tmux
        run: python3 scripts/apply_tmux.py --self-test
      - name: bash syntax
        run: bash -n agent-state.tmux && bash -n scripts/run-watcher.sh && bash -n scripts/status.sh && bash -n scripts/choose-tree.sh && bash -n scripts/utils/tmux.sh
